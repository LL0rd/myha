# Weekly version updates. Minor and patch updates arrive as one pull request per ecosystem,
# major updates one by one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /myha/gateway
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # pnpm projects use the npm ecosystem; Dependabot updates pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /myha/web
    schedule:
      interval: weekly
    # Design §7 pins React 18, React Router 6 and Vite 6; their majors are manual upgrades.
    ignore:
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: react-router
        update-types: ["version-update:semver-major"]
      - dependency-name: react-router-dom
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Reads the FROM lines of the Dockerfile. The base image pins in build.yaml stay manual.
  - package-ecosystem: docker
    directory: /myha
    schedule:
      interval: weekly
    # Design E17 pins Node 22 for the web build stage.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
