name: Image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency: image-${{ github.ref }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Job permissions replace the workflow ones, so contents: read is repeated for checkout.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve version and base image
        id: meta
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          build_from=$(sed -n "s/^  ${ARCH}: *//p" myha/build.yaml)
          test -n "$build_from"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            # Branch dispatch: the dev- prefix never looks like a release version or latest.
            version=dev-${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}
          fi
          echo "build_from=$build_from" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: myha
          platforms: ${{ matrix.platform }}
          push: true
          # Build provenance and an SBOM as attestations next to the image.
          provenance: true
          sbom: true
          build-args: BUILD_FROM=${{ steps.meta.outputs.build_from }}
          # latest only for release tags: a branch dispatch publishes dev-<branch> and leaves latest alone.
          tags: |
            ghcr.io/ll0rd/myha-${{ matrix.arch }}:${{ steps.meta.outputs.version }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/ll0rd/myha-{0}:latest', matrix.arch) || '' }}
          labels: |
            org.opencontainers.image.title=myHA
            org.opencontainers.image.source=https://github.com/LL0rd/myha
            org.opencontainers.image.licenses=Apache-2.0
            io.hass.version=${{ steps.meta.outputs.version }}
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
