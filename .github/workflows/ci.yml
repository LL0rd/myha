name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every main commit gets its own result; superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: myha/gateway
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # setup-uv publishes no major tags since v8, only immutable release tags.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.10.x" # same minor as the uv image in the Dockerfile
          enable-cache: true
          cache-dependency-glob: myha/gateway/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest -q --cov=myha_gateway --cov-report=term

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: myha/web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: myha/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: myha/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: myha/web/dist
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read base image
        id: base
        run: |
          build_from=$(sed -n "s/^  amd64: *//p" myha/build.yaml)
          test -n "$build_from"
          echo "build_from=$build_from" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: myha
          platforms: linux/amd64
          push: false
          load: true
          build-args: BUILD_FROM=${{ steps.base.outputs.build_from }}
          tags: myha-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        # Like scripts/build-image.sh: --entrypoint bypasses s6, no --rm keeps the logs of a crashed container.
        run: |
          cid=$(docker run -d --entrypoint /opt/myha/venv/bin/myha-gateway \
            -e MYHA_DATA_DIR=/data -e MYHA_PUBLIC_ENABLED=1 -e MYHA_PUBLIC_ORIGIN=http://127.0.0.1:18443 \
            --tmpfs /data -p 127.0.0.1:18443:8443 "myha-ci:$GITHUB_SHA" serve)
          trap 'rc=$?; [ "$rc" -eq 0 ] || docker logs "$cid"; docker rm -f "$cid" >/dev/null' EXIT
          for _ in $(seq 30); do
            if curl -fs --connect-timeout 2 --max-time 3 http://127.0.0.1:18443/healthz >/dev/null; then
              curl -fsS --connect-timeout 2 --max-time 3 http://127.0.0.1:18443/healthz; echo
              curl -fsSI --connect-timeout 2 --max-time 3 http://127.0.0.1:18443/
              exit 0
            fi
            sleep 1
          done
          echo "gateway not healthy after 30 attempts" >&2
          exit 1
