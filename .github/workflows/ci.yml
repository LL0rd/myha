name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every main commit gets its own result; superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: myha/gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.x" # same minor as the uv image in the Dockerfile
          enable-cache: true
          cache-dependency-glob: myha/gateway/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      # The developer scripts live outside the package; checked with the gateway's settings.
      - run: uv run ruff check ../../scripts
      - run: uv run mypy --strict ../../scripts/install-on-ha.py
      - run: uv run pytest -q --cov=myha_gateway --cov-branch --cov-report=term
      # Coverage gate (design §11) on the data of the run above: policy and auth need 85 %
      # of lines and branches.
      - run: uv run coverage report --fail-under=85 --include="myha_gateway/policy/*,myha_gateway/auth/*"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: myha/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: myha/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: myha/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: myha/web/dist
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.x" # same minor as the uv image in the Dockerfile
          enable-cache: true
          cache-dependency-glob: myha/gateway/uv.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: tests/e2e/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            myha/web/pnpm-lock.yaml
            tests/e2e/pnpm-lock.yaml
      - run: uv sync --locked
        working-directory: myha/gateway
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: myha/web
      - run: node scripts/check-no-external.mjs myha/web/dist/guest
      - run: pnpm install --frozen-lockfile
        working-directory: tests/e2e
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: pnpm exec playwright test
        working-directory: tests/e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            tests/e2e/test-results
            tests/e2e/playwright-report
            tests/e2e/stack-logs
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read base image
        id: base
        run: |
          build_from=$(sed -n "s/^  amd64: *//p" myha/build.yaml)
          test -n "$build_from"
          echo "build_from=$build_from" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: myha
          platforms: linux/amd64
          push: false
          load: true
          build-args: BUILD_FROM=${{ steps.base.outputs.build_from }}
          tags: myha-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: bash scripts/build-image.sh --smoke-only "myha-ci:$GITHUB_SHA"
