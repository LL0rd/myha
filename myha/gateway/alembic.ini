# Alembic CLI configuration for developers. The gateway itself migrates through
# myha_gateway.db.run_migrations and does not read this file.
[alembic]
script_location = %(here)s/myha_gateway/db/migrations
# Placeholder; set MYHA_DB_URL, e.g. sqlite+aiosqlite:////tmp/myha.sqlite
sqlalchemy.url = sqlite+aiosqlite:///myha-dev.sqlite
